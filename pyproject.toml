[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtea"
version = "0.4.0"
description = "Mailtea Python SDK — send, schedule, and manage email from your app or AI agent."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mailtea" }]
keywords = ["mailtea", "email", "transactional-email", "sdk", "ai-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Communications :: Email",
]
dependencies = []

[project.urls]
Homepage = "https://mailtea.app"
Documentation = "https://docs.mailtea.app"
Repository = "https://github.com/mailtea-app/mailtea-python"

[tool.hatch.build.targets.wheel]
packages = ["mailtea"]
